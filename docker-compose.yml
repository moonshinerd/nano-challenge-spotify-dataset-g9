version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=spotify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spotify"]
      interval: 5s
      timeout: 5s
      retries: 5

  setup:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ./data:/data
      - ./src:/src
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/spotify
    command: >
      bash -c "
      echo 'Running database initialization...' &&
      python save_stats.py &&
      python init_db.py &&
      echo 'Running massive data ingestion (this may take a few minutes)...' &&
      python ingest_1m.py &&
      echo 'Setup completed successfully!'
      "

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./data:/data
      - ./src:/src
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://user:password@db:5432/spotify
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      # Sem VITE_API_URL fixo de propósito: o front-end (App.jsx) usa
      # window.location.hostname + porta 8000, então funciona tanto em
      # localhost quanto acessando pelo IP da máquina na rede local.
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
